; PHP limits for uploads (read by PHP-FPM/CGI on shared hosting).
; Must stay above submission.max_file_mb in config/event.php so the site can
; show its own friendly "too large" message. Check with: php bin/check-env.php
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 2
max_input_time = 300
max_execution_time = 60
memory_limit = 128M
display_errors = Off
log_errors = On
